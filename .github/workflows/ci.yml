---
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: |
          set -euo pipefail
          gh release download v0.11.0 --repo koalaman/shellcheck \
            --pattern 'shellcheck-v0.11.0.linux.x86_64.tar.xz' --output shellcheck.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 --wildcards '*/shellcheck'
          sudo install -m 755 shellcheck /usr/local/bin/shellcheck
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install mandoc
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mandoc
      - name: ShellCheck at zero findings
        run: make lint
      - name: yamllint
        run: pipx run yamllint==1.37.1 -s -c .yamllint.yml .github .yamllint.yml

  test:
    name: test (${{ matrix.runner }}, ${{ matrix.shell }}, ${{ matrix.toolset }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            shell: dash
            toolset: native
          - runner: ubuntu-26.04
            shell: zsh
            toolset: native
          - runner: ubuntu-26.04
            shell: bash
            toolset: native
          - runner: ubuntu-26.04
            shell: dash
            toolset: gnu
          - runner: ubuntu-26.04
            shell: dash
            toolset: uutils
          - runner: macos-26
            shell: /bin/sh
            toolset: native
          - runner: macos-26
            shell: /bin/bash
            toolset: native
          - runner: macos-26
            shell: /bin/zsh
            toolset: native
          - runner: macos-26
            shell: /bin/sh
            toolset: homebrew
          - runner: macos-26
            shell: /opt/homebrew/bin/bash
            toolset: homebrew
          - runner: macos-26
            shell: /opt/homebrew/bin/zsh
            toolset: homebrew
          - runner: macos-26
            shell: /bin/sh
            toolset: uutils
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install shells and tools (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats dash zsh ffmpeg mjpegtools vcdimager mandoc
      - name: Install shells and tools (macOS)
        if: runner.os == 'macOS'
        run: brew install --formula bats-core bash dash zsh ffmpeg-full mjpegtools vcdimager
      - name: Install the GNU toolset (Linux)
        if: runner.os == 'Linux' && matrix.toolset == 'gnu'
        run: sudo apt-get install -y -qq gnu-coreutils gawk
      - name: Install the uutils toolset (Linux)
        if: runner.os == 'Linux' && matrix.toolset == 'uutils'
        run: sudo apt-get install -y -qq rust-coreutils
      - name: Install the Homebrew toolset (macOS)
        if: runner.os == 'macOS' && matrix.toolset == 'homebrew'
        run: brew install --formula coreutils findutils gnu-sed gawk grep diffutils libiconv file-formula
      - name: Install the uutils toolset (macOS)
        if: runner.os == 'macOS' && matrix.toolset == 'uutils'
        run: brew install --formula uutils-coreutils uutils-diffutils uutils-findutils
      - name: Put the ${{ matrix.toolset }} toolset first on PATH
        env:
          TOOLSET: ${{ matrix.toolset }}
        run: sh scripts/toolset.sh "${TOOLSET}" "${RUNNER_TEMP}/toolset" >> "${GITHUB_PATH}"
      - name: Show which shell runs the suites
        if: contains(matrix.shell, 'bash') || contains(matrix.shell, 'zsh')
        env:
          SHELL_UNDER_TEST: ${{ matrix.shell }}
        run: '"${SHELL_UNDER_TEST}" --version | head -n 1'
      - name: Show which tools the run uses
        run: sh bin/yakitsuke doctor
      - name: Run the suites under ${{ matrix.shell }}
        env:
          YK_SHELLS: ${{ matrix.shell }}
        run: sh test/run-matrix.sh

  coverage:
    name: coverage (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f  # v1.335.0
        with:
          bundler-cache: true
      - name: Install the test tools (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats ffmpeg mjpegtools vcdimager mandoc
      - name: Install the test tools (macOS)
        if: runner.os == 'macOS'
        run: brew install --formula bash bats-core ffmpeg-full mjpegtools vcdimager
      - name: Measure line coverage
        run: sh scripts/coverage.sh 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-${{ runner.os }}
          path: coverage/.resultset.json
          include-hidden-files: true
          retention-days: 1

  coverage-gate:
    name: coverage gate
    needs: coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-*
          path: results
      - name: Merge both platforms and enforce 100% line coverage
        run: >-
          python3 scripts/coverage-gate.py '/(bin/yakitsuke|lib/[a-z]+\.sh)\Z' 100
          results/coverage-Linux/.resultset.json results/coverage-macOS/.resultset.json

  release:
    name: release
    needs: [lint, test, coverage-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.published.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: lts/*
      - name: Install release tooling
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
      - name: Record the tag a release just published
        id: published
        run: echo "tag=$(git tag --points-at HEAD | head -n 1)" >> "${GITHUB_OUTPUT}"

  formula:
    name: formula
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/formula.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
